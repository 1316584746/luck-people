<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>婚礼抽奖大屏</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            wedding: {
              red: '#E63946',
              gold: '#FFD700',
              deepRed: '#9E2A2B',
            }
          },
          fontFamily: {
            wedding: ['"Ma Shan Zheng"', 'cursive']
          }
        }
      }
    }
  </script>
  
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
  
  <style type="text/tailwindcss">
    @layer utilities {
      .text-shadow-gold {
        text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
      }
      .user-card {
        min-width: 200px;
        margin: 0 15px;
        flex-shrink: 0;
      }
    }
    
    /* 左右滚动动画（慢速） */
    .slow-scroll {
      animation: slowScroll 60s linear infinite;
    }
    /* 左右滚动动画（快速） */
    .fast-scroll {
      animation: fastScroll 10s linear infinite;
    }
    @keyframes slowScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    @keyframes fastScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
    
    /* 中奖动画 */
    .winner-pulse {
      animation: pulse 0.5s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
      to { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 215, 0, 0.8); }
    }
  </style>
</head>

<body class="bg-gradient-to-r from-wedding-deepRed to-wedding-red min-h-screen text-white overflow-x-hidden">
  <!-- 顶部装饰 -->
  <div class="h-16 bg-wedding-gold/20 flex items-center justify-center">
    <div class="w-32 h-1 mx-2 bg-wedding-gold"></div>
    <i class="fa fa-heart text-wedding-gold text-2xl"></i>
    <div class="w-32 h-1 mx-2 bg-wedding-gold"></div>
  </div>

  <!-- 标题 -->
  <header class="py-6 text-center">
    <h1 class="text-[clamp(2.5rem,6vw,4rem)] font-wedding text-wedding-gold text-shadow-gold">
      新婚抽奖盛典
    </h1>
    <p class="text-[clamp(1rem,2vw,1.5rem)] mt-2 text-wedding-gold/90">
      <i class="fa fa-heart mr-2"></i> 百年好合 · 永结同心 <i class="fa fa-heart ml-2"></i>
    </p>
  </header>

  <main class="container mx-auto px-4 max-w-7xl">
    <!-- 抽奖滚动区域 -->
    <section class="mt-8 relative">
      <!-- 滚动容器（全屏幕宽度） -->
      <div class="w-full overflow-hidden rounded-xl border-4 border-wedding-gold/50">
        <!-- 滚动轨道（内部放用户卡片，宽度足够长） -->
        <div id="scrollTrack" class="flex py-12 slow-scroll">
          <!-- 动态填充用户卡片 -->
        </div>
      </div>
      
      <!-- 抽奖按钮 -->
      <div class="text-center mt-8">
        <button 
          id="lotteryBtn" 
          class="px-12 py-4 bg-wedding-gold text-wedding-deepRed rounded-lg font-wedding text-[clamp(1.2rem,3vw,1.8rem)] transition transform hover:scale-105 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <i class="fa fa-gift mr-2"></i> 开始抽奖
        </button>
        <p id="countdown" class="mt-4 text-wedding-gold text-xl hidden">
          倒计时: <span id="countdownNum">10</span>秒
        </p>
      </div>
    </section>
    
    <!-- 中奖展示区 -->
    <section class="mt-12 bg-white/10 rounded-2xl p-6 border-2 border-wedding-gold/30">
      <h2 class="text-[clamp(1.2rem,2vw,2rem)] font-wedding text-wedding-gold mb-6 text-center">
        幸运中奖名单
      </h2>
      <div id="winnerList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="col-span-full text-center text-gray-300 py-12 border border-dashed border-wedding-gold/30 rounded-lg">
          暂无中奖嘉宾
        </div>
      </div>
    </section>
    
    <!-- 操作按钮 -->
    <div class="mt-8 text-center mb-12">
      <a href="sign.html" class="px-6 py-2 bg-wedding-gold/20 hover:bg-wedding-gold/30 text-wedding-gold rounded-lg text-sm transition inline-block">
        <i class="fa fa-user-plus mr-1"></i> 嘉宾签到入口
      </a>
      <button 
        onclick="resetData()" 
        class="ml-4 px-6 py-2 bg-white/10 hover:bg-white/20 text-white rounded-lg text-sm transition"
      >
        <i class="fa fa-refresh mr-1"></i> 重置抽奖
      </button>
    </div>
  </main>

  <script>
    // 全局状态
    let userList = JSON.parse(localStorage.getItem('weddingUsers')) || [];
    let winnerList = JSON.parse(localStorage.getItem('weddingWinners')) || [];
    let isRolling = false;
    let countdownTimer = null;

    // DOM元素
    const scrollTrack = document.getElementById('scrollTrack');
    const lotteryBtn = document.getElementById('lotteryBtn');
    const countdown = document.getElementById('countdown');
    const countdownNum = document.getElementById('countdownNum');
    const winnerListEl = document.getElementById('winnerList');

    // 初始化
    window.onload = () => {
      renderUserScroll();
      renderWinnerList();
      updateBtnStatus();
    };

    // 渲染用户滚动列表（从左到右滚动）
    function renderUserScroll() {
      if (userList.length === 0) {
        scrollTrack.innerHTML = `
          <div class="w-full flex justify-center">
            <div class="text-[clamp(1.5rem,3vw,2.5rem)] text-center">
              等待嘉宾签到...
            </div>
          </div>
        `;
        return;
      }

      // 生成用户卡片（重复2份实现无缝滚动）
      const userCards = userList.map(user => `
        <div class="user-card bg-white/10 backdrop-blur-sm rounded-xl p-4 border border-wedding-gold/30 text-center">
          <div class="w-16 h-16 mx-auto bg-wedding-gold/20 rounded-full flex items-center justify-center mb-3">
            <i class="fa fa-user text-wedding-gold text-2xl"></i>
          </div>
          <h3 class="text-xl font-wedding text-wedding-gold">${user.name}</h3>
          <p class="text-gray-300 text-sm mt-1">${maskPhone(user.phone)}</p>
        </div>
      `).join('');

      // 重复渲染一份，实现无限滚动效果
      scrollTrack.innerHTML = userCards + userCards;
    }

    // 开始抽奖（切换到快速滚动+倒计时）
    function startLottery() {
      if (isRolling || userList.length === 0) return;

      isRolling = true;
      lotteryBtn.disabled = true;
      lotteryBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i> 抽奖中...';
      
      // 切换到快速滚动
      scrollTrack.classList.remove('slow-scroll');
      scrollTrack.classList.add('fast-scroll');
      
      // 10秒倒计时
      let seconds = 10;
      countdownNum.textContent = seconds;
      countdown.classList.remove('hidden');
      
      countdownTimer = setInterval(() => {
        seconds--;
        countdownNum.textContent = seconds;
        
        if (seconds <= 0) {
          clearInterval(countdownTimer);
          countdown.classList.add('hidden');
          stopLottery(); // 时间到，停止抽奖
        }
      }, 1000);
    }

    // 停止抽奖，选出中奖者
    function stopLottery() {
      // 恢复慢速滚动
      scrollTrack.classList.remove('fast-scroll');
      scrollTrack.classList.add('slow-scroll');
      
      // 过滤已中奖用户
      const availableUsers = userList.filter(user => 
        !winnerList.some(w => w.phone === user.phone)
      );
      
      if (availableUsers.length === 0) {
        lotteryBtn.innerHTML = '<i class="fa fa-trophy mr-2"></i> 全部中奖';
        return;
      }
      
      // 随机选中1名用户
      const winner = availableUsers[Math.floor(Math.random() * availableUsers.length)];
      winner.winTime = new Date().toLocaleString();
      winner.winNo = winnerList.length + 1;
      winnerList.push(winner);
      
      // 保存数据
      localStorage.setItem('weddingWinners', JSON.stringify(winnerList));
      
      // 高亮显示中奖者（替换当前滚动列表为中奖卡片）
      scrollTrack.innerHTML = `
        <div class="w-full flex justify-center">
          <div class="user-card bg-wedding-gold/20 rounded-xl p-6 border-2 border-wedding-gold text-center winner-pulse">
            <div class="w-20 h-20 mx-auto bg-wedding-gold/30 rounded-full flex items-center justify-center mb-4">
              <i class="fa fa-trophy text-wedding-gold text-3xl"></i>
            </div>
            <h3 class="text-2xl font-wedding text-wedding-gold">恭喜 ${winner.name}</h3>
            <p class="text-white text-sm mt-2">获得幸运大奖！</p>
            <p class="text-white/70 text-xs mt-3">${winner.winTime}</p>
          </div>
        </div>
      `;
      
      // 更新状态
      renderWinnerList();
      updateBtnStatus();
      lotteryBtn.innerHTML = '<i class="fa fa-gift mr-2"></i> 开始抽奖';
      isRolling = false;
    }

    // 渲染中奖名单
    function renderWinnerList() {
      if (winnerList.length === 0) return;
      
      winnerListEl.innerHTML = winnerList.map(winner => `
        <div class="bg-white/5 rounded-xl p-5 border border-wedding-gold/20 text-center">
          <div class="inline-block px-4 py-1 bg-wedding-gold/20 text-wedding-gold rounded-full text-sm mb-3">
            第 ${winner.winNo} 位幸运嘉宾
          </div>
          <h3 class="text-xl font-wedding text-wedding-gold">${winner.name}</h3>
          <p class="text-gray-300 text-sm mt-1">${maskPhone(winner.phone)}</p>
          <p class="text-white/60 text-xs mt-3">${winner.winTime}</p>
        </div>
      `).join('');
    }

    // 辅助函数：手机号脱敏
    function maskPhone(phone) {
      return phone.replace(/(\d{3})(\d{4})(\d{4})/, '$1****$3');
    }

    // 更新按钮状态
    function updateBtnStatus() {
      const hasAvailableUsers = userList.length > winnerList.length;
      lotteryBtn.disabled = !hasAvailableUsers;
      if (!hasAvailableUsers && userList.length > 0) {
        lotteryBtn.innerHTML = '<i class="fa fa-trophy mr-2"></i> 全部中奖';
      }
    }

    // 重置数据
    function resetData() {
      if (confirm('确定重置所有数据吗？签到和中奖记录将清空！')) {
        localStorage.removeItem('weddingUsers');
        localStorage.removeItem('weddingWinners');
        userList = [];
        winnerList = [];
        renderUserScroll();
        renderWinnerList();
        updateBtnStatus();
      }
    }

    // 绑定按钮事件
    lotteryBtn.addEventListener('click', startLottery);
  </script>
</body>
</html>
