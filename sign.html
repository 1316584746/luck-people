<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>婚礼签到</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            wedding: {
              red: '#E63946',    // 婚礼红
              gold: '#FFD700',   // 金色
              pink: '#FFB6C1',   // 粉色
            }
          }
        }
      }
    }
  </script>
  
  <style type="text/tailwindcss">
    @layer utilities {
      .bg-blur {
        backdrop-filter: blur(8px);
      }
      .photo-animation {
        animation: fade 15s infinite;
      }
    }
    
    /* 照片轮播动画 */
    @keyframes fade {
      0%, 20% { opacity: 1; }
      25%, 45% { opacity: 0; }
      50%, 70% { opacity: 1; }
      75%, 95% { opacity: 0; }
      100% { opacity: 1; }
    }
    
    /* 照片容器层级 */
    .photo-item {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0;
    }
    .photo-item:nth-child(1) { animation-delay: 0s; }
    .photo-item:nth-child(2) { animation-delay: 5s; }
    .photo-item:nth-child(3) { animation-delay: 10s; }
  </style>
</head>

<body class="min-h-screen overflow-hidden relative">
  <!-- 背景照片轮播（替换为新人照片） -->
  <div class="absolute inset-0 z-0">
    <div class="photo-item photo-animation" style="background-image: url('https://picsum.photos/id/1062/1200/800');"></div>
    <div class="photo-item photo-animation" style="background-image: url('https://picsum.photos/id/1074/1200/800');"></div>
    <div class="photo-item photo-animation" style="background-image: url('https://picsum.photos/id/1082/1200/800');"></div>
    <div class="absolute inset-0 bg-black/30"></div> <!-- 半透明遮罩，增强文字可读性 -->
  </div>

  <!-- 签到卡片 -->
  <div class="relative z-10 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white/90 bg-blur rounded-2xl p-8 w-full max-w-md shadow-2xl border-2 border-wedding-gold">
      <div class="text-center mb-6">
        <h1 class="text-3xl font-bold text-wedding-red mb-2">
          <i class="fa fa-heart mr-2"></i>新婚快乐
        </h1>
        <p class="text-gray-600">请签到参与抽奖</p>
      </div>
      
      <form id="signForm" class="space-y-4">
        <div>
          <label for="name" class="block text-gray-700 mb-1 font-medium">姓名</label>
          <input 
            type="text" 
            id="name" 
            placeholder="请输入您的姓名" 
            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-wedding-red focus:ring-2 focus:ring-wedding-red/30 transition outline-none"
            required
          >
        </div>
        
        <div>
          <label for="phone" class="block text-gray-700 mb-1 font-medium">手机号码</label>
          <input 
            type="tel" 
            id="phone" 
            placeholder="请输入手机号码" 
            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-wedding-red focus:ring-2 focus:ring-wedding-red/30 transition outline-none"
            required
          >
        </div>
        
        <button 
          type="submit" 
          class="w-full py-3 bg-wedding-red hover:bg-wedding-red/90 text-white rounded-lg font-bold text-lg transition transform hover:scale-105 active:scale-95 mt-4"
        >
          <i class="fa fa-check-circle mr-2"></i>确认签到
        </button>
      </form>
      
      <div class="text-center mt-6">
        <a href="index.html" class="text-wedding-red hover:text-wedding-red/80 text-sm flex items-center justify-center">
          <i class="fa fa-tv mr-1"></i> 切换到抽奖大屏
        </a>
      </div>
    </div>
  </div>

  <script>
    // 从LocalStorage获取签到数据
    let userList = JSON.parse(localStorage.getItem('weddingUsers')) || [];
    
    // 表单提交处理
    document.getElementById('signForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      
      // 校验
      if (!name) {
        alert('请输入姓名');
        return;
      }
      const phoneReg = /^1[3-9]\d{9}$/;
      if (!phoneReg.test(phone)) {
        alert('请输入有效的手机号码');
        return;
      }
      
      // 防止重复签到
      if (userList.some(u => u.phone === phone)) {
        alert('您已签到，感谢参与！');
        this.reset();
        return;
      }
      
      // 保存签到信息
      userList.push({ name, phone, signTime: new Date().toLocaleString() });
      localStorage.setItem('weddingUsers', JSON.stringify(userList));
      
      alert(`签到成功，${name} 祝您新婚快乐！`);
      this.reset();
    });
  </script>
</body>
</html>
